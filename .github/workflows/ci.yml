name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carrental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carrental
      APP_ENV: local
      FAKE_PAYMENTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Kendte sårbarheder i produktionsafhængigheder (M15). Rettes med en opdatering eller
      # en override i pnpm-workspace.yaml.
      - name: Secret-scan
        run: pnpm check:secrets

      - name: Dependency-scan
        run: pnpm audit --prod --audit-level=high

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations
        run: pnpm db:deploy

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Integrationstestene efterlader testdata (fx "Test Model" med egne priser), så databasen
      # nulstilles helt, før demo-data lægges ind til E2E.
      - name: Nulstil database
        run: |
          psql "$DATABASE_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          pnpm db:deploy

      - name: Seed (demo-data til E2E)
        run: pnpm db:seed

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (mobil + desktop, RTL, tilgængelighed)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
